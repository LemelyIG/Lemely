name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # Postgres on the Supabase-local port (54322) with the well-known dev
    # credentials so the DB/auth/authz/seat/device integration tests actually RUN
    # in CI instead of skipping when no server is reachable. (GoTrue is NOT run
    # here, so the live GoTrue auth test still skips; the hermetic auth E2E does not.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,web,db]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy lemely

      - name: Import-linter
        run: lint-imports

      # Apply migrations against the service Postgres — proves the Alembic head
      # applies cleanly on a fresh DB (defaults already point at 127.0.0.1:54322).
      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Pytest
        run: pytest

      # M0.9 (#33): review-rate two-part ratchet gate (spec §4 M0.9, §5).
      #
      # This step DOES run in CI. Verified 2026-08-29 against run 33235411251,
      # whose log carries the gate's own output. The text here previously read
      # "it has not been executed in CI and must not be claimed as
      # CI-verified" — accurate when written, while GitHub Actions was org-wide
      # billing-blocked. Billing was restored, the step began running, and the
      # comment was never updated, so it went on telling every reader that
      # MISSION §13 clause 2's "enforced in CI" half was not happening (DA48).
      #
      # What it does NOT do is BLOCK. The gate exits 0 on a breach while
      # review_rate_ratchet_armed=false, so CI observes and records rather than
      # failing. Clause 2 therefore stays PARTIAL — observation is not
      # enforcement — but the gate is wired, and nobody needs to build it.
      #
      # Arming is not a flag flip. #161/DA33 measured all four limbs failing:
      # signal 3.6x, total 2.9x, p95 5.6x, and three of those are absolute
      # targets that no value of review_rate_last_merged can move. It needs the
      # review rate itself to come down.
      #
      # Falls back to the committed BUILD/review-rate-baseline.json —
      # tests/golden/results/ is gitignored and will not exist on a fresh CI
      # checkout, so CI deterministically gates on the committed artifact.
      - name: Review-rate gate
        run: python scripts/check_review_rate_gate.py

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # The same extras as the `test` job, deliberately. `mypy` and
      # `import-linter` are `language: system` pre-commit hooks — they resolve
      # their target's imports from THIS environment, so `[dev]` alone made mypy
      # report 291 errors of the form `Cannot find implementation or library
      # stub for module named "fastapi"`. That is an environment answer, not a
      # verdict on the code: the identical hook is green locally and in `test`,
      # where the web/db extras are installed.
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,web,db]"
      - run: pre-commit run --all-files --show-diff-on-failure

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build
