name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # Postgres on the Supabase-local port (54322) with the well-known dev
    # credentials so the DB/auth/authz/seat/device integration tests actually RUN
    # in CI instead of skipping when no server is reachable. (GoTrue is NOT run
    # here, so the live GoTrue auth test still skips; the hermetic auth E2E does not.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,web,db]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check lemely tests

      - name: Mypy
        if: matrix.python-version == "3.13"
        run: mypy lemely

      - name: Import-linter
        if: matrix.python-version == "3.13"
        run: lint-imports

      # Apply migrations against the service Postgres — proves the Alembic head
      # applies cleanly on a fresh DB (defaults already point at 127.0.0.1:54322).
      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Pytest
        run: pytest

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,db]"
      - run: pre-commit run --all-files --show-diff-on-failure

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build
