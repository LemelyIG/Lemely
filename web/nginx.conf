# Serves the built SPA and reverse-proxies /api to the backend container so
# the browser only ever talks to ONE origin (this host, port 80). That is the
# whole CORS story for the packaged product — see docker-compose.yml for why
# no CORSMiddleware is installed in the FastAPI app.
#
# `backend` is the docker-compose service name for the Lemely API container;
# Docker's embedded DNS resolves it on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/papers/upload and /api/student/uploads each accept two files (scan
    # + mark_scheme), and lemely/web/upload_utils.py:MAX_UPLOAD_BYTES caps
    # each at 25MB — so a legitimate request can carry ~50MB of multipart
    # body. nginx's own default (1m) sits far below that and would reject
    # the request with a bare 413 before the app's own cap check (which
    # returns a JSON `detail` the frontend renders) ever runs. Set high
    # enough to never pre-empt the app-level cap; the app is the source of
    # truth for the actual limit.
    client_max_body_size 60m;

    # A6 review fix (HIGH 2): declared once, at server scope, so every
    # location inherits them by default — `/api/` and the SPA-fallback `/`
    # below set no `add_header` of their own and get these purely through
    # inheritance. nginx's inheritance rule here is all-or-nothing per
    # context, not per-header: a location that defines ANY `add_header` of
    # its own (the three Cache-Control locations below) does NOT inherit
    # these and must repeat the full set alongside its own Cache-Control —
    # confirmed against nginx's ngx_http_headers_module docs, not assumed.
    # Before this fix, `/`, `/api/`, `/registerSW.js`, `manifest.webmanifest`,
    # `robots.txt`, `brand/*.svg` and everything else served from bare
    # `location /` carried zero of these headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Reverse proxy: /api/* -> the backend service, same path, so
    # web/src/lib/api.ts's same-origin `${BASE}${path}` fetches (BASE="")
    # need no changes to run inside the container the way they do in Vite's
    # own dev-server proxy (web/vite.config.ts). No `add_header` of its own,
    # so it inherits the five above from the server block.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The correction pipeline streams progress over SSE
        # (lemely/web/routers/{student,teacher}.py, text/event-stream) —
        # buffering would hold events until nginx's buffer fills or the
        # response ends, defeating the live progress the frontend renders.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Never cache index.html — it references hashed asset filenames, and a
    # stale cached shell would keep loading assets from a previous build.
    # Sets its own Cache-Control, so per the server-block comment above it
    # must repeat the five security headers too — it does not inherit them.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # Service worker: must be revalidated every load or an update can never
    # take over an already-open tab (registerType: "prompt" in
    # vite.config.ts still needs the browser to see a fresh sw.js to notice,
    # and the reader's own "Reload" click is what finishes the update).
    # Repeats the five headers for the same reason /index.html does.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # Hashed build assets (JS/CSS/fonts/images under /assets/) are
    # content-addressed by Vite — safe to cache aggressively. Repeats the
    # five headers for the same reason /index.html does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # SPA client-side routing (react-router-dom): fall back to index.html for
    # any path that isn't a real static file. No `add_header` of its own, so
    # it inherits the five from the server block — the actual served file for
    # any real static path (robots.txt, manifest.webmanifest, brand/*.svg,
    # screenshots/, widgets/, .well-known/) also lands here and carries them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
