# Serves the built SPA and reverse-proxies /api to the backend container so
# the browser only ever talks to ONE origin (this host, port 80). That is the
# whole CORS story for the packaged product — see docker-compose.yml for why
# no CORSMiddleware is installed in the FastAPI app.
#
# `backend` is the docker-compose service name for the Lemely API container;
# Docker's embedded DNS resolves it on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/papers/upload and /api/student/uploads each accept two files (scan
    # + mark_scheme), and lemely/web/upload_utils.py:MAX_UPLOAD_BYTES caps
    # each at 25MB — so a legitimate request can carry ~50MB of multipart
    # body. nginx's own default (1m) sits far below that and would reject
    # the request with a bare 413 before the app's own cap check (which
    # returns a JSON `detail` the frontend renders) ever runs. Set high
    # enough to never pre-empt the app-level cap; the app is the source of
    # truth for the actual limit.
    client_max_body_size 60m;

    # Reverse proxy: /api/* -> the backend service, same path, so
    # web/src/lib/api.ts's same-origin `${BASE}${path}` fetches (BASE="")
    # need no changes to run inside the container the way they do in Vite's
    # own dev-server proxy (web/vite.config.ts).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The correction pipeline streams progress over SSE
        # (lemely/web/routers/{student,teacher}.py, text/event-stream) —
        # buffering would hold events until nginx's buffer fills or the
        # response ends, defeating the live progress the frontend renders.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Never cache index.html — it references hashed asset filenames, and a
    # stale cached shell would keep loading assets from a previous build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service worker: must be revalidated every load or an update can never
    # take over an already-open tab (registerType: "autoUpdate" in
    # vite.config.ts still needs the browser to see a fresh sw.js to notice).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets (JS/CSS/fonts/images under /assets/) are
    # content-addressed by Vite — safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client-side routing (react-router-dom): fall back to index.html for
    # any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
