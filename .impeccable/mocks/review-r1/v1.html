<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Review V1</title><link rel=stylesheet href=base.css><style>main{padding:28px 36px;display:grid;gap:18px;align-content:start;min-width:0}
.top{display:flex;align-items:end;gap:14px;flex-wrap:wrap}.top h1{font:800 32px/1.15 'Schibsted Grotesk';letter-spacing:-.02em}
.prog{display:flex;align-items:center;gap:14px}.prog .bar{flex:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
.card{background:var(--l);border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--o)}
#list{padding:6px 8px}.row{grid-template-columns:auto 1.1fr 1.15fr 1.1fr;padding:14px 14px;border-radius:14px}.row+.row{box-shadow:0 -1px 0 var(--ov)}
body.sel .row{grid-template-columns:22px 1.1fr 1.15fr 1.1fr}.ck{margin-inline-end:-6px}.row .ck{display:none}body.sel .row .ck{display:grid}
#panelwrap{position:sticky;top:24px;padding:22px;display:grid;gap:14px}#panel{display:grid;gap:14px}</style><body><nav class=rail><b>lemely</b><a>Overview</a><a>Classes</a><a>Papers</a><a class=on>Review <span class=m data-left></span></a><a>Mark schemes</a><a>Quizzes</a></nav><div class=kit><a href=v1.html class="on">V1</a><a href=v2.html class="">V2</a><a href=v3.html class="">V3</a><a href=# data-reset>Reset</a></div><main><div class=top><div style="flex:1"><div class=lab>All classes · ranked by marks at stake</div><h1>Review · <span data-left></span> answers waiting</h1></div><button class="btn o" data-sel>Select</button><button class=btn data-bulk>Approve clear · <span class=m data-picked>0</span> selected</button></div>
<div class=prog><span class=m><span data-done></span> of <span data-total></span> decided</span><div class=bar><b data-fill style="width:0"></b></div></div>
<div class=grid><div class=card id=list-card><div id=list></div><div class=done id=done><div class=disp>Queue clear.</div><p style="color:var(--v);margin-top:10px;font-size:16px">Every flagged answer is decided. Nice and tidy.</p></div></div><div class=card id=panelwrap><div id=panel></div></div></div></main><div class=toast id=toast><span></span><button id=undo>Undo</button></div><script src=review.js></script></body>
