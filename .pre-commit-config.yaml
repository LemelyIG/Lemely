repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # `reports/` holds machine-generated phase evidence (axe/Lighthouse JSON,
      # the contact sheet, screenshot corpora). Rewriting those files makes the
      # committed artifact differ byte-for-byte from what the tool actually
      # emitted, so the next re-baseline run shows a spurious diff. Exempt them
      # from the two formatting hooks only — `detect-private-key` still sees
      # everything.
      - id: trailing-whitespace
        exclude: ^reports/
      - id: end-of-file-fixer
        exclude: ^reports/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy lemely
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter
        entry: lint-imports
        language: system
        pass_filenames: false
