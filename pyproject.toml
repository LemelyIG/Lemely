[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lemely"
version = "1.0.0"
description = "Accuracy-first educational assessment tool for CAIE marking workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Yassin Diab", email = "lemelyig@gmail.com" }]
dependencies = [
  "pydantic>=2.11.10,<2.13",
  "pydantic-settings>=2.4,<3",
  "click>=8.3,<9",
  "rich>=15,<16",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "google-genai>=2.1,<3",
  "PyMuPDF>=1.27,<2",
  "Pillow>=12,<13",
  "jinja2>=3.1,<4",
  "pdfplumber>=0.11,<1",
  # Imported directly by scripts/rasterise_handwritten_fixtures.py (#59). It was
  # already present transitively via pdfplumber; declared explicitly so a future
  # pdfplumber release that drops or swaps its renderer cannot silently break
  # the fixture flattening.
  "pypdfium2>=4,<6",
  "numpy>=2,<3",
  "fonttools>=4.63,<5",
]

[project.optional-dependencies]
# Capped at the last minor this build's gates were actually run against (6.19.0).
# `<7` let the CI runner resolve **6.23.1**, whose event-listener typing makes
# `mypy lemely` report 12 × `"Button" has no attribute "click"` in
# `lemely/app/gradio_app.py` — red in CI, green on 6.19.0 locally, on the same
# tree. Runtime behaviour is unaffected; it is the type surface that moved.
ui = ["gradio>=6.1,<6.20"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "google-cloud-storage>=3.1,<4",
]
db = [
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
]
# Every tool here decides a gate, so every one of them is upper-bounded. An
# unbounded gate tool means the verdict can change with no commit — CI installs
# fresh and resolves latest, this venv does not, and the two then disagree about
# an identical tree. `ruff` and `gradio` both did exactly that (D6.10). The caps
# are the versions the build's green record was established against; raising one
# is a deliberate commit that re-runs the gates, which is the point.
dev = [
  "pytest>=8,<10",         # installed: 9.1.1
  "pytest-cov>=5,<8",      # installed: 7.1.0
  # Pinned exactly, and kept in lockstep with `.pre-commit-config.yaml`'s
  # `ruff-pre-commit` rev. An unpinned linter is a gate whose verdict changes
  # without a commit: `>=0.7` resolved to 0.16 on the CI runner while this venv
  # and the pre-commit hook both held 0.15.20, so `ruff check .` was red in CI
  # and green everywhere else on the identical tree. Bump both lines together.
  "ruff==0.15.20",
  # Minor-capped, not major-capped: mypy adds new checks in minor releases, so a
  # minor bump is the same drift as ruff's. Installed here: 2.1.0 — note the
  # floor said `>=1.13`, i.e. the declared range spanned a major this build has
  # never run a gate on.
  "mypy>=2.1,<2.2",
  "pre-commit>=4,<5",      # installed: 4.6.0
  "import-linter>=2.1,<3", # installed: 2.12
  # Parallel test execution, used only by `scripts/check.sh --fast` (the
  # non-authoritative in-run gate). The default `pytest` invocation — the one
  # CI runs and the one `check.sh` runs without `--fast` — stays serial and
  # coverage-instrumented, so xdist can never change a gate verdict. Capped
  # like every other tool here: a worker-scheduling change that reorders tests
  # can surface latent inter-test dependencies, and that should arrive as a
  # deliberate commit that re-runs the gates.
  "pytest-xdist>=3.6,<4",
]

[project.scripts]
lemely = "lemely.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lemely"]

[tool.hatch.build.targets.sdist]
include = ["lemely", "tests", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Autogenerated Alembic migrations use Alembic's own style (deprecated typing
# aliases, unused op/sa imports on no-op migrations); exclude from strict linting.
# .claude/skills is vendored third-party content (design skill packs), not
# ours to lint — same reasoning pre-commit's --all-files scope already
# excludes it for (BUILD/DECISIONS.md D2.11); `ruff check .`/`ruff format
# --check .` need the same exclusion or they pick up 300+ pre-existing
# findings in code we don't own and never see in a normal package-scoped run.
# BUILD/accuracy-runs holds frozen measurement evidence: the raw EvalRecord
# JSONL, the manifests, and the ad-hoc driver script each sweep was actually
# run with (M0.3/#27 onward). These are the record of how a published figure
# was produced, so they must never be reformatted or "fixed" after the fact —
# a later `ruff format` pass rewriting a sweep driver would silently change
# the artifact that a number in BUILD/ACCURACY-REPORT.md is evidenced by.
# Excluded from lint deliberately; nothing here is imported by the package.
extend-exclude = ["lemely/db/migrations/versions", ".claude", "BUILD/accuracy-runs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "TCH", "RUF", "ANN", "D", "T20", "S"]
# D100/D104/D107: module/package/__init__ docstrings not required.
# D101/D102/D103: class/method/function docstrings deferred to a docs phase.
ignore = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "ANN",
  "D",
  "S105",
  "S106",
  "S107",
  "S311",
  "RUF059",
  "SLF001",
  "TC001",
  "TC002",
  "TC003",
]
"tests/architecture/**" = ["S607", "S603"]
# Fixed-argument subprocess.run (fresh-interpreter import isolation) and
# urllib.request.urlopen against a http://127.0.0.1 URL this same test spun
# up — both are the deliberate mechanism, not untrusted input.
"tests/eval/test_labeller_blindness.py" = ["S603", "S310"]
"lemely/runtime/logging.py" = ["ANN401"]
# Prompt files contain long strings and non-ASCII characters by design.
"lemely/io/prompts/**" = ["E501", "RUF001", "TCH"]
# Pydantic model files need type imports at runtime; TCH would move them to TYPE_CHECKING.
"lemely/core/schemas.py" = ["TCH"]
"lemely/eval/manifest.py" = ["TCH"]
"lemely/core/loose_schemas.py" = ["TCH", "D205", "RUF001", "UP042", "E741"]
"lemely/runtime/config.py" = ["TCH"]
# Prompts __init__ re-exports everything; F403 and F401 are intentional.
"lemely/io/prompts/__init__.py" = ["F403", "F401"]
"lemely/io/gemini.py" = ["PLW0603", "PLW0602", "BLE001", "ANN401", "E501", "TCH", "SIM102"]
"lemely/io/parsers.py" = ["TCH"]
"lemely/io/det/gmp.py" = ["ANN401"]
# Unicode lookalikes are the entire subject matter here: the module maps Adobe
# SymbolEncoding bytes to the Greek letters and operators they actually denote,
# so RUF001/2/3 fire on every correct entry (Α is Alpha, not A — that is the point).
"lemely/io/det/symbols.py" = ["RUF001", "RUF002", "RUF003"]
"lemely/io/det/metadata.py" = ["ANN401", "RUF001"]
"lemely/io/det/tables.py" = ["ANN401", "RUF002"]
"lemely/io/det/parser.py" = ["ANN401"]
"lemely/io/det/question_papers.py" = ["ANN401", "RUF001", "RUF003"]
"lemely/io/validation.py" = ["RUF001"]
"lemely/io/correction_ai.py" = ["BLE001", "ANN401", "TCH"]
"lemely/io/subject.py" = ["TCH"]
"lemely/io/answer_extraction.py" = ["ANN401", "TCH"]
# Injectable-SDK-client precedent (lemely/io/gemini.py's `_genai_client`): the
# client/blob objects come from an untyped SDK (google.cloud.*).
"lemely/io/storage_gcs.py" = ["ANN401"]
"lemely/app/gradio_app.py" = ["ANN401", "TCH"]
"lemely/app/live_log.py" = ["TCH"]
"lemely/app/gradio_callbacks.py" = ["ANN401", "TCH", "E501"]
"tests/test_schemas.py" = ["RUF001"]
"tests/test_parsers_det.py" = ["RUF002"]
"tests/test_accuracy_harness.py" = ["RUF003"]
"tests/test_cli_new_commands.py" = ["E501"]
"tests/test_integrity.py" = ["E501"]
"lemely/app/cli.py" = ["T20", "S106", "ANN202"]
# One-off/periodic data-ingestion tools: progress output to stderr is the point.
"scripts/**" = ["T20"]
# Web DTOs / converters / FastAPI Depends need type imports at runtime; TCH
# would move them into TYPE_CHECKING and break pydantic + dependency injection.
"lemely/web/schemas.py" = ["TC001", "TC002", "TC003"]
"lemely/web/services/grading.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/meta.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/auth.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/teacher.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/classes.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/student.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/school.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/admin.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_teacher.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_analytics.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_quiz.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/quiz.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_student.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_auth.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_school.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_admin.py" = ["TC001", "TC002", "TC003"]
"lemely/web/sse.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/parent.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_parent.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/me.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_me.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/study_plan.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/flashcards.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/exam_calendar.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/invites.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_invites.py" = ["TC001", "TC002", "TC003"]
"lemely/web/jobs.py" = ["ANN401"]
"lemely/web/deps.py" = ["ANN401"]
# SQLAlchemy 2.0 ORM models resolve Mapped[...] annotations at runtime, so the
# types they reference (uuid, datetime, date, enums) must be imported at
# runtime; TC00x would move them into TYPE_CHECKING and break mapper config.
"lemely/db/models/**" = ["TC001", "TC002", "TC003"]
# Auth modules: uuid/Role/datetime are referenced in dataclass fields, Protocol
# signatures, and ORM queries that are resolved/used at runtime; TC00x would move
# them into TYPE_CHECKING and break those. Mirrors the web/DI exemptions above.
"lemely/auth/mirror.py" = ["TC001", "TC003"]
"lemely/auth/tokens.py" = ["TC003"]
# StudySession.date is a pydantic field (StrictModel): pydantic resolves
# `from __future__ import annotations` string annotations at class-definition
# time against the module's runtime namespace, so `datetime` must stay a
# real import here, not move into TYPE_CHECKING (same reasoning as the ORM
# and auth exemptions above).
"lemely/core/study.py" = ["TC003"]
# Synthetic test-fixture generator: randomness is for visual jitter, not
# cryptography or security-sensitive selection.
"lemely/accuracy/synth.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "gradio.*",
  "fitz.*",
  "tomli",
  "pdfplumber.*",
  "alembic.*",
  "fontTools.*",
  # google-cloud-storage ships no py.typed marker / stubs (D2.x-style gap,
  # same class as gradio/fitz above).
  "google.cloud.*",
]
ignore_missing_imports = true

# Autogenerated Alembic migration scripts follow Alembic's own conventions.
[[tool.mypy.overrides]]
module = ["lemely.db.migrations.versions.*"]
ignore_errors = true

# Pydantic's mypy plugin injects Any into generated __init__ signatures;
# disabling explicit-any per module avoids false positives in model files.
[[tool.mypy.overrides]]
module = [
  "lemely.eval.manifest",
  "lemely.eval.records",
  "lemely.labelling.records",
  "lemely.labelling.rulings",
  "lemely.core.schemas",
  "lemely.core.loose_schemas",
  "lemely.core.question_papers",
  "lemely.core.topics",
  "lemely.runtime.config",
  "lemely.runtime.logging",
  "lemely.runtime.events",
  "lemely.runtime.budget_notify",
  "lemely.app.gradio_app",
  "lemely.app.live_log",
  "lemely.io.gemini",
  # Injectable-SDK-client precedent (see lemely.io.gemini above): the
  # constructor's `_client: Any` is the same test-seam shape, and the SDK's
  # own `Client`/`Blob` types are otherwise untyped here (google.cloud.*
  # above).
  "lemely.io.storage_gcs",
  "lemely.io.answer_extraction",
  "lemely.io.correction_ai",
  "lemely.io.subject",
  "lemely.app.gradio_callbacks",
  "lemely.io.det.metadata",
  "lemely.io.det.tables",
  "lemely.io.det.parser",
  "lemely.io.det.gmp",
  "lemely.io.det.question_papers",
  "lemely.io.study_plan_ai",
  "lemely.web.sse",
  "lemely.web.jobs",
  "lemely.web.schemas",
  "lemely.web.schemas_teacher",
  "lemely.web.schemas_analytics",
  "lemely.web.schemas_student",
  "lemely.web.schemas_auth",
  "lemely.web.schemas_school",
  "lemely.web.schemas_admin",
  "lemely.web.schemas_classes",
  "lemely.web.schemas_review",
  "lemely.web.schemas_quiz",
  "lemely.web.schemas_placement",
  "lemely.web.schemas_practice",
  "lemely.web.schemas_flashcards",
  "lemely.web.schemas_parent",
  "lemely.web.schemas_me",
  "lemely.web.schemas_announcements",
  "lemely.web.schemas_announcements_student",
  "lemely.web.schemas_exam_calendar",
  "lemely.web.schemas_notifications",
  "lemely.web.schemas_student_profile",
  "lemely.web.schemas_study_plan",
  "lemely.web.schemas_leaderboard",
  "lemely.web.schemas_friends",
  "lemely.web.schemas_devices",
  "lemely.web.schemas_student_classes",
  "lemely.web.schemas_xp",
  "lemely.web.schemas_invites",
  # httpx `.json()` and pyjwt `decode()` return Any at the trust boundary; these
  # modules parse those payloads defensively into typed dataclasses/Claims.
  "lemely.auth.gotrue",
  "lemely.auth.tokens",
  "lemely.accuracy.harness",
  "lemely.core.study",
  "lemely.core.integrity_schemas",
  "lemely.core.history",
  "lemely.core.generation",
  "lemely.core.flashcards",
  "lemely.core.at_risk",
  "lemely.core.class_analytics",
]
disallow_any_explicit = false

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov=lemely --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
# An exception raised on a background thread (the marking and grading pools in
# lemely/web/routers/{quiz,teacher}.py never call Future.result()) otherwise
# surfaces only as a warning and leaves the suite green. #114's ledger guard
# relies on being loud, so a swallowed thread exception must fail the run.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.coverage.run]
source = ["lemely"]
branch = true
omit = [
  "lemely/app/gradio_app.py",
  "lemely/db/migrations/*",
]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "lemely"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "app",
  "io",
  "core",
]
containers = ["lemely"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Runtime must not depend on domain layers"
type = "forbidden"
source_modules = ["lemely.runtime"]
forbidden_modules = ["lemely.core", "lemely.io", "lemely.app"]

[[tool.importlinter.contracts]]
name = "Evaluation analyses must stay pure — no IO, no app"
type = "forbidden"
source_modules = ["lemely.eval"]
forbidden_modules = ["lemely.io", "lemely.app"]

[[tool.importlinter.contracts]]
name = "The blind labeller must not depend on the correction pipeline"
type = "forbidden"
source_modules = ["lemely.labelling"]
forbidden_modules = [
  "lemely.core.correction",
  "lemely.io.correction_ai",
  "lemely.core.schemas",
]

[tool.pyright]
venvPath = '.'
venv = '.venv'
