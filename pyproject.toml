[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lemely"
version = "0.1.0"
description = "Accuracy-first educational assessment tool for CAIE marking workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Yassin Diab", email = "lemelyig@gmail.com" }]
dependencies = [
  "pydantic>=2.11.10,<2.13",
  "pydantic-settings>=2.4,<3",
  "click>=8.3,<9",
  "rich>=15,<16",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "google-genai>=2.1,<3",
  "PyMuPDF>=1.27,<2",
  "Pillow>=12,<13",
  "jinja2>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "numpy>=2,<3",
]

[project.optional-dependencies]
ui = ["gradio>=6.1,<7"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]
db = [
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4",
  "import-linter>=2.1",
]

[project.scripts]
lemely = "lemely.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lemely"]

[tool.hatch.build.targets.sdist]
include = ["lemely", "tests", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Autogenerated Alembic migrations use Alembic's own style (deprecated typing
# aliases, unused op/sa imports on no-op migrations); exclude from strict linting.
# .claude/skills is vendored third-party content (design skill packs), not
# ours to lint — same reasoning pre-commit's --all-files scope already
# excludes it for (BUILD/DECISIONS.md D2.11); `ruff check .`/`ruff format
# --check .` need the same exclusion or they pick up 300+ pre-existing
# findings in code we don't own and never see in a normal package-scoped run.
extend-exclude = ["lemely/db/migrations/versions", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "TCH", "RUF", "ANN", "D", "T20", "S"]
# D100/D104/D107: module/package/__init__ docstrings not required.
# D101/D102/D103: class/method/function docstrings deferred to a docs phase.
ignore = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "ANN",
  "D",
  "S105",
  "S106",
  "S107",
  "S311",
  "RUF059",
  "SLF001",
  "TC001",
  "TC002",
  "TC003",
]
"tests/architecture/**" = ["S607", "S603"]
"lemely/runtime/logging.py" = ["ANN401"]
# Prompt files contain long strings and non-ASCII characters by design.
"lemely/io/prompts/**" = ["E501", "RUF001", "TCH"]
# Pydantic model files need type imports at runtime; TCH would move them to TYPE_CHECKING.
"lemely/core/schemas.py" = ["TCH"]
"lemely/core/loose_schemas.py" = ["TCH", "D205", "RUF001", "UP042", "E741"]
"lemely/runtime/config.py" = ["TCH"]
# Prompts __init__ re-exports everything; F403 and F401 are intentional.
"lemely/io/prompts/__init__.py" = ["F403", "F401"]
"lemely/io/gemini.py" = ["PLW0603", "PLW0602", "BLE001", "ANN401", "E501", "TCH", "SIM102"]
"lemely/io/parsers.py" = ["TCH"]
"lemely/io/det/gmp.py" = ["ANN401"]
"lemely/io/det/metadata.py" = ["ANN401", "RUF001"]
"lemely/io/det/tables.py" = ["ANN401"]
"lemely/io/det/parser.py" = ["ANN401"]
"lemely/io/validation.py" = ["RUF001"]
"lemely/io/correction_ai.py" = ["BLE001", "ANN401", "TCH"]
"lemely/io/subject.py" = ["TCH"]
"lemely/io/answer_extraction.py" = ["ANN401", "TCH"]
"lemely/app/gradio_app.py" = ["ANN401", "TCH"]
"lemely/app/live_log.py" = ["TCH"]
"lemely/app/gradio_callbacks.py" = ["ANN401", "TCH", "E501"]
"tests/test_schemas.py" = ["RUF001"]
"tests/test_parsers_det.py" = ["RUF002"]
"tests/test_accuracy_harness.py" = ["RUF003"]
"tests/test_cli_new_commands.py" = ["E501"]
"tests/test_integrity.py" = ["E501"]
"lemely/app/cli.py" = ["T20", "S106", "ANN202"]
# One-off/periodic data-ingestion tools: progress output to stderr is the point.
"scripts/**" = ["T20"]
# Web DTOs / converters / FastAPI Depends need type imports at runtime; TCH
# would move them into TYPE_CHECKING and break pydantic + dependency injection.
"lemely/web/schemas.py" = ["TC001", "TC002", "TC003"]
"lemely/web/services/grading.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/meta.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/auth.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/teacher.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/student.py" = ["TC001", "TC002", "TC003"]
"lemely/web/routers/school.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_teacher.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_student.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_auth.py" = ["TC001", "TC002", "TC003"]
"lemely/web/schemas_school.py" = ["TC001", "TC002", "TC003"]
"lemely/web/sse.py" = ["TC001", "TC002", "TC003"]
"lemely/web/jobs.py" = ["ANN401"]
"lemely/web/deps.py" = ["ANN401"]
# SQLAlchemy 2.0 ORM models resolve Mapped[...] annotations at runtime, so the
# types they reference (uuid, datetime, date, enums) must be imported at
# runtime; TC00x would move them into TYPE_CHECKING and break mapper config.
"lemely/db/models/**" = ["TC001", "TC002", "TC003"]
# Auth modules: uuid/Role/datetime are referenced in dataclass fields, Protocol
# signatures, and ORM queries that are resolved/used at runtime; TC00x would move
# them into TYPE_CHECKING and break those. Mirrors the web/DI exemptions above.
"lemely/auth/mirror.py" = ["TC001", "TC003"]
"lemely/auth/tokens.py" = ["TC003"]
# Synthetic test-fixture generator: randomness is for visual jitter, not
# cryptography or security-sensitive selection.
"lemely/accuracy/synth.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gradio.*", "fitz.*", "tomli", "pdfplumber.*", "alembic.*"]
ignore_missing_imports = true

# Autogenerated Alembic migration scripts follow Alembic's own conventions.
[[tool.mypy.overrides]]
module = ["lemely.db.migrations.versions.*"]
ignore_errors = true

# Pydantic's mypy plugin injects Any into generated __init__ signatures;
# disabling explicit-any per module avoids false positives in model files.
[[tool.mypy.overrides]]
module = [
  "lemely.core.schemas",
  "lemely.core.loose_schemas",
  "lemely.runtime.config",
  "lemely.runtime.logging",
  "lemely.runtime.events",
  "lemely.runtime.budget_notify",
  "lemely.app.gradio_app",
  "lemely.app.live_log",
  "lemely.io.gemini",
  "lemely.io.answer_extraction",
  "lemely.io.correction_ai",
  "lemely.io.subject",
  "lemely.app.gradio_callbacks",
  "lemely.io.det.metadata",
  "lemely.io.det.tables",
  "lemely.io.det.parser",
  "lemely.io.det.gmp",
  "lemely.io.study_plan_ai",
  "lemely.web.sse",
  "lemely.web.jobs",
  "lemely.web.schemas",
  "lemely.web.schemas_teacher",
  "lemely.web.schemas_student",
  "lemely.web.schemas_auth",
  "lemely.web.schemas_school",
  "lemely.web.schemas_classes",
  # httpx `.json()` and pyjwt `decode()` return Any at the trust boundary; these
  # modules parse those payloads defensively into typed dataclasses/Claims.
  "lemely.auth.gotrue",
  "lemely.auth.tokens",
  "lemely.accuracy.harness",
  "lemely.core.study",
  "lemely.core.integrity_schemas",
  "lemely.core.history",
  "lemely.core.generation",
]
disallow_any_explicit = false

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov=lemely --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lemely"]
branch = true
omit = [
  "lemely/app/gradio_app.py",
  "lemely/db/migrations/*",
]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "lemely"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "app",
  "io",
  "core",
]
containers = ["lemely"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Runtime must not depend on domain layers"
type = "forbidden"
source_modules = ["lemely.runtime"]
forbidden_modules = ["lemely.core", "lemely.io", "lemely.app"]

[tool.pyright]
venvPath = '.'
venv = '.venv'
