[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lemely"
version = "0.1.0"
description = "Accuracy-first educational assessment tool for CAIE marking workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Yassin Diab", email = "lemelyig@gmail.com" }]
dependencies = [
  "pydantic>=2.11.10,<2.13",
  "pydantic-settings>=2.4,<3",
  "click>=8.3,<9",
  "rich>=15,<16",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "google-genai>=2.1,<3",
  "PyMuPDF>=1.27,<2",
  "Pillow>=12,<13",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
ui = ["gradio>=6.1,<7"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4",
  "import-linter>=2.1",
  "respx>=0.21",
]

[project.scripts]
lemely = "lemely.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lemely_mvp"]

[tool.hatch.build.targets.sdist]
include = ["lemely_mvp", "tests", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "TCH", "RUF", "ANN", "D", "T20", "S"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]
"lemely/app/cli.py" = ["T20"]
"lemely_mvp/cli.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gradio.*", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov=lemely_mvp --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
markers = [
  "live: requires GEMINI_API_KEY and makes real API calls (skipped by default)",
]

[tool.coverage.run]
source = ["lemely_mvp"]
branch = true
omit = ["lemely_mvp/gradio_app.py"]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "lemely_mvp"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "lemely_mvp.cli",
  "lemely_mvp.mark_schemes",
  "lemely_mvp.correction",
  "lemely_mvp.schemas",
]
